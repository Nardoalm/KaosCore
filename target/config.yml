license: PUT_YOUR_KEY_HERE
features:
  nametag:
    enabled: true
  scoreboard:
    enabled: false
    update-ticks: 4
    bottom: '&bpvphard.live'
    lobby-line: '&fLobby: &a#1'
    title-animation:
    - '&f&lP&b&lVPHARD'
    - '&b&lP&f&lV&b&lPHARD'
    - '&b&lPV&f&lP&b&lHARD'
    - '&b&lPVP&f&lH&b&lARD'
    - '&b&lPVPH&f&lA&b&lRD'
    - '&b&lPVPHA&f&lR&b&lD'
    - '&b&lPVPHAR&f&lD'
    - '&f&lPVPHARD'
    - '&f&lPVPHARD'
    - '&b&lPVPHARD'
    - '&b&lPVPHARD'
    lines:
    - '&7&m        &m               '
    - ''
    - '&fRank: %kaoscore_prefix%'
    - '&fLobby: &a#1'
    - ''
    - '&fPlayers: &a{online}'
    - ''
    - '&7&m        &m               '
    - '&bpvphard.live'
  join-title:
    enabled: true
    title: '&9&lPVPHARD'
    subtitle: '&fWelcome to our server!'
    fade-in: 20
    stay: 20
    fade-out: 20
  tablist:
    enabled: true
    header:
    - ''
    - '&9&lPVPHARD'
    - ''
    footer:
    - ''
    - '&fStore: &bstore.pvphard.live'
    - '&fDiscord: &bdc.pvphard.live'
    - ''
  welcome-messages:
    enabled: true
  protections:
    spawn:
      enabled: false
      cancel-damage: true
      cancel-hunger: true
      cancel-combust: true
    pvp:
      enabled: false
    world:
      enabled: false
      cancel-block-break: true
      cancel-block-place: true
    entities:
      cancel-spawn: false
      clear-drops: false
sit:
  enabled: true
  carry:
    require-empty-hand: true
  ride:
    dismount-lock-ticks: 15
  right-click:
    enabled: false
    require-empty-hand: true
practice-blocks:
  message: ''
  commands:
  - fly
  - voar
  - f
  - sit
chat:
  format: '%kaos_level% %kaoscore_medal_chat_static%%kaoscore_tag_prefix%{player}&8:
    &f{message}'
  default-color: '&7'
  vip-color: '&f'
  mentions:
    enabled: true
    format: '&e@{nick}&f'
    actionbar: ''
    notify-sound: NOTE_PLING
    notify-volume: 1.0
    notify-pitch: 1.2
divulgar:
  enabled: true
  permission: kaoscore.member.divulgar
  bypass-permission: kaoscore.staff.divulgar
  cooldown-seconds: 60
  broadcast:
  - '&9&l[HARD] &8| %kaoscore_tag_prefix%{player} &7is live at: &f{link}'
autobroadcast:
  enabled: false
  interval-seconds: 300
  random: true
  messages:
  - '&b&lTIP &8| &fPurchase exclusive ranks on our store: &bpvphard.live'
  - '&b&lSOCIAL &8| &fJoin our official Discord: &bdc.pvphard.live'
  - '&b&lTIP &8| &fUse &b/wm &fto customize your join message!'
spawn-limits:
  enabled: false
  only-spawn-world: false
  bypass-permission: kaoscore.spawnlimits.bypass
  check-interval-ticks: 10
  void-level-y: -20
  max-distance-from-spawn: 200.0
  message-void: '&fYou fell into the void and were brought back.'
  message-radius: '&fYou went too far away and were brought back.'
  sound: ENDERMAN_TELEPORT
database:
  type: mongodb
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: root
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout-ms: 10000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      validation-timeout-ms: 5000
      leak-detection-threshold-ms: 0
  mongodb:
    uri: mongodb://localhost:27017
    database: kaoscore
npc-spawn:
  enabled: false
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  skin-nick: Notch
jumppad:
  block: SLIME_BLOCK
  forward-force: 1.9
  upward-force: 1.1
  disable-fall-damage: true
  effects:
    sound:
      enabled: true
      type: BAT_TAKEOFF
    particles:
      enabled: true
      type: MOBSPAWNER_FLAMES
  locations:
    '1':
      world: Lobby
      x: 1
      y: 63
      z: 13
    '2':
      world: Lobby
      x: -1
      y: 63
      z: 12
    '3':
      world: Lobby
      x: -2
      y: 63
      z: 11
    '4':
      world: Lobby
      x: 2
      y: 63
      z: 11
spawn:
  location: Lobby;0.523701639778834;65.0;0.4498850573306655;0.27547085;0.6694163
auth:
  location:
    world: Lobby
    x: -68.46755868316674
    y: 57.0
    z: -34.61256175171827
    yaw: 181.68555
    pitch: 0.9588711
