# KaosCore - Mensagens de Punicoes
# Use "&" para cores. O plugin converte para "§".
#
# Placeholders:
# - {reason}  -> motivo
# - {expires} -> data de expiracao (ban) / "Permanente"
# - {duration} -> tempo restante (mute)
# - {staff}   -> responsavel (kick)

ban:
  permanent:
    - "&cVocê foi banido permanentemente."
    - ""
    - "&cMotivo: &7{reason}"
    - "&cExpira em: &7Permanente"
    - "&eAdquira seu unban em: &bwww.freepmc.com.br"
    - "&cBanido injustamente? Contate-nos via"
    - "&9discord.gg/freepmc"
  temporary:
    - "&cVocê foi banido temporariamente."
    - ""
    - "&cMotivo: &7{reason}"
    - "&cExpira em: &7{expires}"
    - "&eAdquira seu unban em: &bwww.freepmc.com.br"
    - "&cBanido injustamente? Contate-nos via"
    - "&9discord.gg/freepmc"

kick:
  screen:
    - "&cVocê foi expulso do servidor."
    - ""
    - "&cMotivo: &7{reason}"
    - "&cResponsável: &7{staff}"

mute:
  chat:
    - "&c&lMUTE ➔ &cVocê está mutado."
    - "&cMotivo: &7{reason}"
    - "&cDuração: &7{duration}"
  notice:
    - "&c&lMUTE ➔ &cVocê foi mutado."
    - "&cMotivo: &7{reason}"
    - "&cDuração: &7{duration}"

