license: PUT_YOUR_KEY_HERE
features:
  nametag:
    enabled: true
  scoreboard:
    enabled: false
    update-ticks: 4
    bottom: '&balleypvp.us'
    lobby-line: '&fLobby: &a#1'
    title-animation:
      - '&f&lA&b&lLLEY'
      - '&b&lA&f&lL&b&lLEY'
      - '&b&lAL&f&lL&b&lEY'
      - '&b&lALL&f&lE&b&lY'
      - '&b&lALLE&f&lY'
      - '&f&lALLEY'
      - '&f&lALLEY'
      - '&b&lALLEY'
      - '&b&lALLEY'
      - '&f&lALLEY'
      - '&f&lALLEY'
    lines:
      - '&7&m        &m               '
      - ''
      - '&fRank: %kaoscore_prefix%'
      - '&fLobby: &a#1'
      - ''
      - '&fPlayers: &a{online}'
      - ''
      - '&7&m        &m               '
      - '&balleypvp.us'
  join-title:
    enabled: true
    title: '&b&lALLEY'
    subtitle: '&fWelcome to our server!'
    fade-in: 20
    stay: 40
    fade-out: 20
  tablist:
    enabled: true
    header:
      - ''
      - '&b&lALLEY'
      - ''
    footer:
      - ''
      - '&fStore: &bstore.alleypvp.us'
      - '&fDiscord: &bdc.alleypvp.us'
      - ''
  welcome-messages:
    enabled: true
  protections:
    spawn:
      enabled: false
      cancel-damage: true
      cancel-hunger: true
      cancel-combust: true
    pvp:
      enabled: false
    world:
      enabled: false
      cancel-block-break: true
      cancel-block-place: true
    entities:
      cancel-spawn: false
      clear-drops: false
sit:
  enabled: true
  carry:
    require-empty-hand: true
  ride:
    dismount-lock-ticks: 15
  right-click:
    enabled: false
    require-empty-hand: true
practice-blocks:
  message: '&b&lALLEY &8➔ &cYou cannot use commands during Practice.'
  commands:
    - fly
    - voar
    - f
    - sit
chat:
  format: '%kaos_level% %kaoscore_medal_chat_static% %kaoscore_tag_prefix%{player}
    &8» &f{message}'
  default-color: '&7'
  vip-color: '&f'
  mentions:
    enabled: true
    format: '&b@{nick}&f'
    actionbar: '&b&l! &fPlayer &b{nick} &fmentioned you!'
    notify-sound: NOTE_PLING
    notify-volume: 1.0
    notify-pitch: 1.2
divulgar:
  enabled: true
  permission: kaoscore.member.divulgar
  bypass-permission: kaoscore.staff.divulgar
  cooldown-seconds: 60
  broadcast:
    - '&b&lSOCIAL &8➔ %kaoscore_tag_prefix%{player} &7is live at: &f{link}'
autobroadcast:
  enabled: true
  interval-seconds: 300
  random: true
  messages:
    - '&b&lTIP &8➔ &fPurchase exclusive ranks on our store: &balleypvp.us'
    - '&b&lSOCIAL &8➔ &fJoin our official Discord: &bdiscord.alleypvp.us'
    - '&b&lTIP &8➔ &fUse &b/wm &fto customize your join message!'
spawn-limits:
  enabled: true
  only-spawn-world: true
  bypass-permission: kaoscore.spawnlimits.bypass
  check-interval-ticks: 10
  void-level-y: -20
  max-distance-from-spawn: 200.0
  message-void: '&b&lALLEY &8➔ &fYou fell into the void and were brought back.'
  message-radius: '&b&lALLEY &8➔ &fYou went too far away and were brought back.'
  sound: ENDERMAN_TELEPORT
database:
  type: mongodb
  mysql:
    host: localhost
    port: 3306
    database: database
    user: root
    password: root
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout-ms: 10000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      validation-timeout-ms: 5000
      leak-detection-threshold-ms: 0
  mongodb:
    uri: mongodb://localhost:27017
    database: kaoscore
npc-spawn:
  enabled: false
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  skin-nick: Notch
