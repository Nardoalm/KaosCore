# KaosCore - Punishment Messages
# Use "&" for colors. The plugin converts them to "§".
#
# Placeholders:
# - {reason}  -> reason
# - {expires} -> expiration date (ban) / "Permanent"
# - {duration} -> remaining time (mute)
# - {staff}   -> punisher (kick)

ban:
  permanent:
    - "&cYou have been permanently banned."
    - ""
    - "&cReason: &7{reason}"
    - "&cExpires on: &7Permanent"
    - "&ePurchase your unban at: &balleypvp.us"
    - "&cBanned unfairly? Contact us via"
    - "&9discord.gg/alleypvp"
  temporary:
    - "&cYou have been temporarily banned."
    - ""
    - "&cReason: &7{reason}"
    - "&cExpires on: &7{expires}"
    - "&ePurchase your unban at: &balleypvp.us"
    - "&cBanned unfairly? Contact us via"
    - "&9discord.gg/alleypvp"

kick:
  screen:
    - "&cYou have been kicked from the server."
    - ""
    - "&cReason: &7{reason}"
    - "&cPunisher: &7{staff}"

mute:
  chat:
    - "&cYou are muted."
    - "&cReason: &7{reason}"
    - "&cDuration: &7{duration}"
  notice:
    - "&cYou have been muted."
    - "&cReason: &7{reason}"
    - "&cDuration: &7{duration}"